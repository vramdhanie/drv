[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax).
# Apple Silicon macOS only: drv depends on the Keychain and other Darwin
# APIs, and ort (ONNX Runtime, via fastembed) ships no prebuilt binaries
# for x86_64-apple-darwin.
targets = ["aarch64-apple-darwin"]
# Publish the formula to the personal tap on each release
tap = "vramdhanie/homebrew-tap"
publish-jobs = ["homebrew"]
